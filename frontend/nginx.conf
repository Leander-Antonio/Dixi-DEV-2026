server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte às rotas do React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache mais agressivo para arquivos estáticos com hash no nome
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
